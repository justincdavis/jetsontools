name: PyPI Build
on: [ push ]
jobs:
  build_check:
    name: "Build jetsontools package"

    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4
    - uses: astral-sh/setup-uv@v6
    - name: Build jetsontools
      run: uv build
    - name: Install and import the wheel on each Python
      run: |
        for version in 3.8 3.9 3.10 3.11 3.12 3.13 3.14 3.15; do
          echo "::group::Python ${version}"
          uv venv ".venv-${version}" --python "${version}"
          uv pip install --python ".venv-${version}" dist/*.whl
          ".venv-${version}/bin/python" -c "import jetsontools"
          echo "::endgroup::"
        done
