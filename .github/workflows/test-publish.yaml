name: Publish Package (PyPI)

on:
  pull_request:
    branches:
      - main

jobs:
  build_and_publish:
    name: "Build and Publish PyPI package - TEST"

    runs-on: ubuntu-latest

    environment:
      name: pypi
      url: https://test.pypi.org/p/jetsontools
    permissions:
      id-token: write

    steps:
    - uses: actions/checkout@v4
      with:
        fetch-depth: 0
    - name: Set up Python 3.14
      uses: actions/setup-python@v1
      with:
        python-version: "3.14"
    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install build setuptools-scm
    - name: Set a unique version
      run: |
        base=$(python -m setuptools_scm --strip-dev)
        echo "SETUPTOOLS_SCM_PRETEND_VERSION=${base}.dev$(date +%Y%m%d)${GITHUB_RUN_NUMBER}" >> "$GITHUB_ENV"
    - name: Build jetsontools
      run: |
        python -m build --sdist --wheel --outdir dist/
    - name: Publish distribution to PyPI
      uses: pypa/gh-action-pypi-publish@release/v1
      with:
        repository-url: https://test.pypi.org/legacy/
        password: ${{ secrets.TEST_PYPI_API_TOKEN }}
